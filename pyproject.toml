[project]
name = "talkbalt-platform-api"
version = "0.1.0"
description = "Talkbalt platform API: accounts, business setup, bookings, call history and analytics."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.117",
    "fastapi>=0.159.1",
    "livekit-api>=1.2.2",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Never resolve packages published in the last two weeks (supply-chain safety).
exclude-newer = "2026-10-28T00:00:00Z"

[tool.ruff]
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["F", "E", "W", "B", "I", "UP", "SIM"]
ignore = ["E501"]
